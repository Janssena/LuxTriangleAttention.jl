name: CPU tests

# The `cpu` backend of test/runtests.jl: needs no GPU (the Reactant tests run on its CPU client, the Python parity
# sweeps read their recorded references, the lazy `python_fixtures` artifact, and run no Python). The `gpu` tests need an NVIDIA or Apple GPU and are run by hand.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU tests (${{ matrix.os }}, Julia ${{ matrix.julia }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]       # macOS arm64 runners are often capacity-limited; the CPU group needs no Apple GPU
        julia: ['1.12']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Install test dependencies
        run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Run the CPU tests
        run: julia --project=test test/runtests.jl cpu
        env:
          JULIA_TEST_VERBOSE: 'true'
